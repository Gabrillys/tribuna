<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tribuna</title>

<!-- PWA: permite "Adicionar à tela inicial" e abrir sem barra de endereço -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tribuna">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1E3A5F; overflow: hidden; }
  #frame {
    position: fixed; top: 0; left: 0; width: 100vw;
    height: 100vh; height: calc(var(--real-vh, 1vh) * 100);
    border: none; display: block;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; background: #1E3A5F; color: #FBF7F0;
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif; z-index: 10;
    transition: opacity .3s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(251,247,240,0.25); border-top-color: #C68A3E;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script>
  // Corrige a barra de endereço dinâmica do Chrome/Safari mobile: sem
  // isso, o iframe pode ficar mais alto que a área realmente visível
  // na tela, cortando a parte de baixo do app (ex: botões de rodapé
  // de um popup). Medimos a altura de verdade e usamos ela no CSS.
  function ajustarAlturaFrame_(){
    document.documentElement.style.setProperty('--real-vh', (window.innerHeight * 0.01) + 'px');
  }
  ajustarAlturaFrame_();
  window.addEventListener('resize', ajustarAlturaFrame_);
  window.addEventListener('orientationchange', () => setTimeout(ajustarAlturaFrame_, 200));
</script>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>Tribuna</div>
</div>

<!-- O token vem de ?token=... na URL (link pessoal de cada um) ou,
     se faltar (ex: ícone instalado na tela inicial, sem parâmetros),
     do que foi salvo da última vez que essa pessoa abriu o link. -->
<iframe id="frame"
        title="Tribuna"
        allow="clipboard-write"
        onload="document.getElementById('loading').classList.add('hide')">
</iframe>

<script>
  const EXEC_URL = 'https://script.google.com/macros/s/AKfycbxBtoZq5jjaJIUVi6qXCNBlvFHAlgG7ZcqOiMwPjkvgXq4GfObfSK3gdOD4a7k56sUt/exec';
  const params = new URLSearchParams(location.search);
  let token = params.get('token');
  if (token) {
    try { localStorage.setItem('tribuna_token', token); } catch (e) {}
  } else {
    try { token = localStorage.getItem('tribuna_token') || ''; } catch (e) { token = ''; }
  }
  document.getElementById('frame').src = EXEC_URL + (token ? ('?token=' + encodeURIComponent(token)) : '');
</script>

</body>
</html>
